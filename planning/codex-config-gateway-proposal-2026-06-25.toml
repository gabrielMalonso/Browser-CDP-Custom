# Proposta de migração MCP/CDP - 2026-06-25
#
# Este arquivo é deliberadamente separado de ~/.codex/config.toml.
# Rollback preservado:
# - backup fiel criado em ~/.codex/backups/config.toml.20260625-103435
# - entradas stdio antigas continuam recuperáveis pelo backup

[mcp_servers.gabriel-browsers]
url = "http://127.0.0.1:8787/mcp"
enabled = true
startup_timeout_sec = 5
tool_timeout_sec = 120
http_headers = { Authorization = "Bearer <token de ~/.codex/gabriel-browsers-mcp.env>" }
default_tools_approval_mode = "auto"
disabled_tools = ["browser_run_code_unsafe"]

# Fase de aliases compatíveis, aplicada somente depois do canário validar.

