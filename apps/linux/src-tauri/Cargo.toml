[package]
name = "browser-cdp-custom-linux"
version = "0.1.0"
description = "Linux CDP profile launcher and default-browser router"
authors = ["Gabriel Alonso"]
edition = "2021"

[lib]
name = "browser_cdp_custom_linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
browser-cdp-core = { path = "../crates/cdp-core" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
